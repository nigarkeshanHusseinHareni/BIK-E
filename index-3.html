<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>نقاشی قدم‌به‌قدم</title>
<style>
:root{--bg:#fff3d6;--ink:#2b2d42;--accent:#ef476f;--blue:#118ab2;--green:#06d6a0;--yellow:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:10px 14px;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
button:disabled{opacity:.4}
.screen{display:none;max-width:760px;margin:0 auto;padding:12px}
.screen.on{display:block}
h1{text-align:center;margin:8px 0 2px;font-size:28px}
.sub{text-align:center;margin:0 0 14px;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;font-size:18px;background:#fff}
.card svg{width:100%;height:auto;background:#eaf6ff;border-radius:12px}
.freeico{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:64px;background:#ffe8f0;border-radius:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.top b{font-size:20px}
.hint{text-align:center;font-size:14px;opacity:.8;margin:0 0 8px;min-height:20px}
.stage{position:relative;width:max(240px,min(100%,620px,calc(100dvh - 300px)));aspect-ratio:1;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.15);overflow:hidden}
.stage svg,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage canvas{touch-action:none;cursor:crosshair}
.stage svg{pointer-events:none}
#guide.off{opacity:0}
.old{fill:none;stroke:#b8bcc4;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.now{fill:none;stroke:#ef476f;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#222;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0 8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.sw.sel,.tb.sel{outline:4px solid var(--blue);outline-offset:1px}
.tb{display:flex;align-items:center;justify-content:center;min-width:44px;height:40px;padding:0 10px}
.dot{background:#222;border-radius:50%;display:block}
input[type=color]{width:38px;height:38px;border:0;padding:0;border-radius:50%;background:none}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.nav .go{background:var(--green);font-weight:bold}
.free .lessononly{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.on{display:flex}
.box{background:#fff;border-radius:24px;padding:16px;max-width:420px;width:100%;text-align:center}
.box svg{width:100%;max-width:300px;height:auto;background:#eaf6ff;border-radius:16px}
.box h2{margin:4px 0 8px}
.free .lessononly,.colormode .lessononly{display:none}
.free #hint,.free #sample{display:none}
.colormode .brushonly{display:none}
#ol{pointer-events:none}
.tabs,.langbar{display:flex;justify-content:center;gap:8px;margin:0 0 12px}
.langbar{justify-content:flex-start}
.brand{margin:22px auto 8px;text-align:center}.brand img{width:min(100%,380px);height:auto;border-radius:20px;display:block;margin:0 auto 6px;box-shadow:0 4px 14px rgba(0,0,0,.25)}.brand small{opacity:.7;font-size:13px}
</style>
</head>

  tip:'می‌توانی با این رنگ‌ها نقاشی‌ات را رنگ کنی.',ok:'باشه',clr:'همهٔ نقاشی پاک شود؟',lang:'کوردی'},
 ku:{app:'وێنەکێشان هەنگاو بە هەنگاو',ask:'حەز دەکەیت چی بکێشیت؟',learn:'✏️ فێربە بیکێشیت',color:'🎨 ڕەنگکردن',free:'وێنەکێشانی ئازاد',
  back:'➡️ گەڕانەوە',hint:'هێڵە سوورەکە شوێن بکەوە و بیکێشە!',hintc:'ڕەنگێک هەڵبژێرە و لەسەر بەشەکان کلیک بکە!',
  prev:'▶ هەنگاوی پێشوو',next:'هەنگاوی دواتر ◀',done:'تەواو بوو 🎉',guide:'👁 ڕێنیشاندەر',sample:'🌈 نموونەی ڕەنگاوڕەنگ',save:'💾 هەڵگرتن',
  step:(a,b)=>'هەنگاوی '+fa(a)+' لە '+fa(b),great:'ئافەرین! 🎉',samp:'نموونەی ڕەنگاوڕەنگ',now:'ئێستا وێنەکەت ڕەنگ بکە!',
  tip:'دەتوانیت بەم ڕەنگانە وێنەکەت ڕەنگ بکەیت.',ok:'باشە',clr:'هەموو وێنەکە بسڕدرێتەوە؟',lang:'فارسی'}
};
let LANG='fa', homeMode='learn', mode='learn', cur=null, step=0;
try{LANG=localStorage.getItem('lang')||'fa'}catch(e){}
if(!T[LANG]) LANG='fa';
const t=k=>T[LANG][k];
const nm=s=>NM[s.id][LANG]+' '+NM[s.id].e;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  window.scrollTo(0,0);
}

/* ---------- صفحهٔ اصلی ---------- */
function buildGrid(){
  $('grid').innerHTML=S.map((s,i)=>'<button class="card" data-i="'+i+'"><svg viewBox="0 0 300 300">'+full(s)+'</svg><b>'+nm(s)+'</b></button>').join('')
   +'<button class="card" data-i="free"><div class="freeico">🖍️</div><b>'+t('free')+'</b></button>';
}
$('grid').addEventListener('click',e=>{
  const b=e.target.closest('.card'); if(!b) return;
  if(b.dataset.i==='free') openLesson(null,'free'); else openLesson(S[+b.dataset.i],homeMode);
});
function setTab(m){
  homeMode=m;
  $('tab-learn').classList.toggle('sel',m==='learn');
  $('tab-color').classList.toggle('sel',m==='color');
}
$('tab-learn').onclick=()=>setTab('learn');
$('tab-color').onclick=()=>setTab('color');
$('langbtn').onclick=()=>{
  LANG=LANG==='fa'?'ku':'fa';
  try{localStorage.setItem('lang',LANG)}catch(e){}
  applyLang();
};
function applyLang(){
  document.documentElement.lang=LANG==='ku'?'ckb':'fa';
  document.title=t('app');
  $('apptitle').textContent='🎨 '+t('app');
  $('ask').textContent=t('ask');
  $('langbtn').textContent=t('lang');
  $('tab-learn').textContent=t('learn');
  $('tab-color').textContent=t('color');
  $('back').textContent=t('back');
  $('prev').textContent=t('prev');
  $('gtoggle').textContent=t('guide');
  $('sample').textContent=t('sample');
  $('save').textContent=t('save');
  buildGrid();
  if($('s-draw').classList.contains('on')) render();
}

/* ---------- بوم نقاشی ---------- */
const N=700, cv=$('cv'), ctx=cv.getContext('2d'), ol=$('ol'), octx=ol.getContext('2d');
cv.width=cv.height=ol.width=ol.height=N;
let color='#e63946', size=14, erase=false, drawing=false, last=null, hist=[], mask=null;

const COLORS=['#e63946','#ff9f1c','#ffd60a','#70e000','#06d6a0','#118ab2','#7209b7','#ff70a6','#8d5524','#222222'];
const SIZES=[8,16,30];
$('tools').innerHTML=
  COLORS.map((c,i)=>'<button class="sw'+(i===0?' sel':'')+'" data-c="'+c+'" style="background:'+c+'"></button>').join('')
 +'<input type="color" id="cpick" value="#e63946">'
 +SIZES.map((s,i)=>'<button class="tb brushonly sz'+(i===1?' sel':'')+'" data-s="'+s+'"><span class="dot" style="width:'+(s/1.6+4)+'px;height:'+(s/1.6+4)+'px"></span></button>').join('')
 +'<button class="tb brushonly" id="eraser">🧽</button><button class="tb" id="undo">↩️</button><button class="tb" id="clear">🗑️</button>';

function clearSel(sel){document.querySelectorAll(sel).forEach(b=>b.classList.remove('sel'))}
$('tools').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.c){color=b.dataset.c;erase=false;clearSel('.sw');b.classList.add('sel');$('eraser').classList.remove('sel')}
  else if(b.dataset.s){size=+b.dataset.s;clearSel('.sz');b.classList.add('sel')}
});
$('cpick').addEventListener('input',e=>{color=e.target.value;erase=false;clearSel('.sw');$('eraser').classList.remove('sel')});
$('eraser').onclick=()=>{erase=!erase;$('eraser').classList.toggle('sel',erase)};
$('undo').onclick=()=>{const h=hist.pop(); if(h) ctx.putImageData(h,0,0)};
$('clear').onclick=()=>{if(confirm(t('clr'))){snapshot();ctx.clearRect(0,0,N,N)}};

function snapshot(){hist.push(ctx.getImageData(0,0,N,N)); if(hist.length>15) hist.shift()}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*N/r.width,y:(e.clientY-r.top)*N/r.height}}
function setup(){
  ctx.globalCompositeOperation=erase?'destination-out':'source-over';
  ctx.strokeStyle=ctx.fillStyle=color;
  ctx.lineWidth=erase?size*1.8:size;
  ctx.lineCap=ctx.lineJoin='round';
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(mode==='color'){doFill(pos(e));return}
  cv.setPointerCapture(e.pointerId);
  snapshot(); drawing=true; last=pos(e); setup();
  ctx.beginPath(); ctx.arc(last.x,last.y,ctx.lineWidth/2,0,Math.PI*2); ctx.fill();
});
cv.addEventListener('pointermove',e=>{
  if(!drawing) return; e.preventDefault();
  const p=pos(e); setup();
  ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
  last=p;
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{drawing=false}));

/* ---------- رنگ‌آمیزی (سطل رنگ) ---------- */
function prepColor(s){
  const body=s.steps.flat().map(e=>'<'+e[0]+' '+e[1]+' fill="'+(e[2]==='none'?'none':'#fff')+'"/>').join('');
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="'+N+'" height="'+N+'"><rect width="300" height="300" fill="#fff"/>'
    +'<g stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">'+body+'</g></svg>';
  const img=new Image();
  img.onload=()=>{
    if(cur!==s||mode!=='color') return;
    const tc=document.createElement('canvas'); tc.width=tc.height=N;
    const c=tc.getContext('2d'); c.drawImage(img,0,0,N,N);
    const d=c.getImageData(0,0,N,N).data;
    const m=new Uint8Array(N*N), o=octx.createImageData(N,N);
    for(let i=0;i<N*N;i++){const r=d[i*4]; m[i]=r<140?1:0; o.data[i*4+3]=255-r}
    octx.putImageData(o,0,0);
    mask=m;
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function doFill(p){
  if(!mask) return;
  const x=Math.round(p.x), y=Math.round(p.y);
  if(x<0||y<0||x>=N||y>=N||mask[y*N+x]) return;
  snapshot();
  const im=ctx.getImageData(0,0,N,N), D=im.data, rgb=hex2rgb(color), seen=new Uint8Array(N*N);
  const paint=k=>{const j=k*4;D[j]=rgb[0];D[j+1]=rgb[1];D[j+2]=rgb[2];D[j+3]=255};
  const stack=[y*N+x]; seen[stack[0]]=1;
  const visit=n=>{
    if(seen[n]) return; seen[n]=1;
    if(mask[n]) paint(n); else stack.push(n);   /* لبهٔ خط هم رنگ می‌شود تا فاصلهٔ سفید نماند */
  };
  while(stack.length){
    const k=stack.pop(), xx=k%N;
    paint(k);
    if(xx>0) visit(k-1);
    if(xx<N-1) visit(k+1);
    if(k>=N) visit(k-N);
    if(k<N*N-N) visit(k+N);
  }
  ctx.putImageData(im,0,0);
}

/* ---------- درس‌ها ---------- */
function openLesson(s,m){
  cur=s; mode=s?m:'free'; step=0; hist=[]; mask=null;
  ctx.clearRect(0,0,N,N); octx.clearRect(0,0,N,N);
  const sc=$('s-draw');
  sc.classList.toggle('free',mode==='free');
  sc.classList.toggle('colormode',mode==='color');
  $('guide').classList.remove('off');
  ol.style.display=mode==='color'?'block':'none';
  if(mode==='color') prepColor(s);
  render(); show('s-draw');
}
function render(){
  if(mode==='free'){$('title').textContent='🖍️ '+t('free');$('guide').innerHTML='';return}
  $('title').textContent=nm(cur);
  $('hint').textContent=mode==='color'?t('hintc'):t('hint');
  if(mode==='color'){$('guide').innerHTML='';return}
  $('stepinfo').textContent=t('step')(step+1,cur.steps.length);
  let h='';
  cur.steps.slice(0,step).forEach(st=>{h+='<g class="old">'+st.map(e=>el(e,false)).join('')+'</g>'});
  h+='<g class="now">'+cur.steps[step].map(e=>el(e,false)).join('')+'</g>';
  $('guide').innerHTML=h;
  $('prev').disabled=step===0;
  $('next').textContent=step===cur.steps.length-1?t('done'):t('next');
}
$('prev').onclick=()=>{if(step>0){step--;render()}};
$('next').onclick=()=>{
  if(step<cur.steps.length-1){step++;render()} else sampleModal(true);
};
$('gtoggle').onclick=()=>$('guide').classList.toggle('off');
$('sample').onclick=()=>{if(cur) sampleModal(false)};
$('back').onclick=()=>show('s-home');

function sampleModal(done){
  $('mbox').innerHTML='<h2>'+(done?t('great'):t('samp'))+'</h2><svg viewBox="0 0 300 300">'+full(cur)+'</svg>'
   +'<p>'+(done?t('now'):t('tip'))+'</p>'
   +'<button id="mclose" style="background:#06d6a0;font-weight:bold">'+t('ok')+'</button>';
  $('modal').classList.add('on');
  $('mclose').onclick=()=>$('modal').classList.remove('on');
}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal') $('modal').classList.remove('on')});

/* ---------- ذخیره به صورت عکس ---------- */
$('save').onclick=()=>{
  const tc=document.createElement('canvas'); tc.width=tc.height=N;
  const c=tc.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,N,N); c.drawImage(cv,0,0);
  if(mode==='color') c.drawImage(ol,0,0);
  tc.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='naghashi-'+(cur?cur.id:'free')+(mode==='color'?'-color':'')+'.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  });
};

applyLang();
</script>
